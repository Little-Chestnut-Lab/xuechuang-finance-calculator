name: 功能建议
description: 说明使用问题、场景、希望功能和预期效果。
title: "[功能建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 具体使用场景
      description: "注明模板、季度或操作环节，不公开私人方案。"
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: 希望实现的功能
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期效果
    validations:
      required: true
